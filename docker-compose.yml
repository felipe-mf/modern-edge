# One command: `docker compose up`.
# The client systems (payroll, dispatch, finance) run separately; their URLs come from the environment.

x-client-systems: &client-systems
  PAYROLL_URL: ${PAYROLL_URL:-http://host.docker.internal:8081}
  DISPATCH_URL: ${DISPATCH_URL:-http://host.docker.internal:8082}
  FINANCE_URL: ${FINANCE_URL:-http://host.docker.internal:8083}
  # Assessment credentials published in each system's API.md; override via .env if they differ.
  PAYROLL_API_KEY: ${PAYROLL_API_KEY:-assess-7f3c9a}
  DISPATCH_CLIENT_ID: ${DISPATCH_CLIENT_ID:-me-assess}
  DISPATCH_CLIENT_SECRET: ${DISPATCH_CLIENT_SECRET:-d1sp4tch-s3cret}
  FINANCE_USER: ${FINANCE_USER:-svc_assess}
  FINANCE_PASSWORD: ${FINANCE_PASSWORD:-Q4-close!}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: northgate
      POSTGRES_PASSWORD: northgate
      POSTGRES_DB: northgate
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northgate -d northgate"]
      interval: 2s
      timeout: 3s
      retries: 30

  pipeline:
    build: .
    command: ["python", "-m", "northgate.pipeline"]
    environment: &app-environment
      <<: *client-systems
      DATA_DIR: /data
      OUTPUT_DIR: /output
      DATABASE_URL: postgresql+psycopg://northgate:northgate@db:5432/northgate
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      ANTHROPIC_CALLOUT_MODEL: ${ANTHROPIC_CALLOUT_MODEL:-claude-sonnet-5-5}
      PAYROLL_DRY_RUN: ${PAYROLL_DRY_RUN:-false}
      PERIOD: ${PERIOD:-}
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
      - ./output:/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # Serves the interface's data once the pipeline has finished. Reads the same database; the review
  # queue can write approved absences to payroll (same exactly-once writer) and refresh ./output.
  api:
    build: .
    command: ["uvicorn", "northgate.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-environment
    volumes:
      - ./output:/output
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      pipeline:
        condition: service_completed_successfully

volumes:
  pgdata:
