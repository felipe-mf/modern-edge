[project]
name = "northgate"
version = "0.1.0"
description = "Northgate data spine and call-out to payroll/billing pipeline (ModernEdge assessment)"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "fastapi",
    "httpx",
    "openpyxl",
    "pdfplumber",
    "psycopg[binary]",
    "pydantic>=2",
    "rapidfuzz",
    "sqlalchemy>=2",
    "tzdata",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["northgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
